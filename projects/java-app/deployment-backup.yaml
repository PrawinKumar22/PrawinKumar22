apiVersion: apps/v1
kind: Deployment

metadata:
  name: java-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: java-app

  template:
    metadata:
      labels:
        app: java-app

    spec:
      containers:
        - name: java-app
          image: java-app:1.3
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          env:
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: java-app-config
                  key: APP_MESSAGE

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: java-app-secret
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: java-app-secret
                  key: DB_PASSWORD

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 12
            periodSeconds: 5
            timeoutSeconds: 2

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          volumeMounts:
            - name: config-volume
              mountPath: /etc/config

            - name: secret-volume
              mountPath: /etc/secret
              readOnly: true

      volumes:
        - name: config-volume
          configMap:
            name: java-app-config

        - name: secret-volume
          secret:
            secretName: java-app-secret
